name: Checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser test tools
        run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify autonomous file and real downloads
        run: npm run test:browser
        env:
          TEST_FILE: ${{ github.workspace }}/dist/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install opencv-python==4.13.0.90 numpy
      - run: node tests/create-opencv-fixtures.mjs
      - run: python tests/verify_opencv.py
